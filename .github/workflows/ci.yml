name: Build and test

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows build and MSTest
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json
      - name: Restore, check formatting, build and test
        shell: pwsh
        run: ./Verify.ps1 -Configuration Release
      # Keep these sequential: both modes share project restore/build intermediates.
      - name: Publish framework-dependent Windows x64 application
        shell: pwsh
        run: ./Build.ps1 -Configuration Release -NoRestore -Publish
      - name: Publish self-contained Windows x64 application
        shell: pwsh
        run: ./Build.ps1 -Configuration Release -NoRestore -Publish -SelfContained
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: PageCollector-TestResults
          path: artifacts/TestResults/*.trx
          if-no-files-found: warn
      - name: Upload framework-dependent Windows x64 application
        uses: actions/upload-artifact@v7.0.2
        with:
          name: PageCollector-win-x64-framework-dependent
          path: dist/win-x64/
          if-no-files-found: error
      - name: Upload self-contained Windows x64 application
        uses: actions/upload-artifact@v7.0.2
        with:
          name: PageCollector-win-x64-self-contained
          path: dist/win-x64_self-contained/
          if-no-files-found: error
